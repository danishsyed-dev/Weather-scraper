<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Scraper</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-image: url('https://images.pexels.com/photos/2771744/pexels-photo-2771744.jpeg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            padding-top: 50px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            /* Prevent horizontal scrollbar */
        }

        .weather-container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            /* Ensure the suggestions are positioned correctly */
        }

        .form-group label {
            font-weight: bold;
        }

        .weather-info {
            margin-top: 20px;
        }

        .weather-info h2 {
            margin-bottom: 20px;
        }

        .search-list {
            border: 1px solid #ccc;
            background: #fff;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            top: calc(100% + 5px);
            /* Position below the input field with some gap */
            left: 0;
            display: none;
            /* Initially hidden */
        }

        .search-item {
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            color: #333;
        }

        .search-item:hover {
            background: #f0f0f0;
        }

        .footer {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-top: 1px solid #ddd;
            position: relative;
            margin-top: auto;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        .footer p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .footer p span {
            font-weight: bold;
            color: #333;
        }

        .footer a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="weather-container">
            <h1 class="text-center">Weather Scraper</h1>
            <form id="weatherForm">
                <div class="form-group">
                    <label for="city">Enter city name:</label>
                    <input type="text" class="form-control" id="city" name="city" placeholder="e.g., Hyderabad"
                        required>
                    <div id="searchList" class="search-list"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Get Weather</button>
            </form>

            <div id="weatherInfo" class="weather-info"></div>
        </div>
    </div>
    <div class="footer">
        <p>Created by <a href="https://github.com/danishsyed-dev" target="_blank">SYED DANISH ALI</a></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Try to load local config first (for development), fallback to config.js -->
    <script>
        // Flag to track if local config loaded
        window.configLoaded = false;
    </script>
    <script src="js/config.local.js" onerror="window.configLoaded = false;"
        onload="window.configLoaded = true;"></script>
    <script>
        // If local config didn't load, we'll use the main config.js
        if (!window.configLoaded) {
            document.write('<script src="js/config.js"><\/script>');
        }
    </script>
    <script src="js/script.js"></script>
</body>

</html>
